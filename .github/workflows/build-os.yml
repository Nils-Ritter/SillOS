name: Build OS

on:
  push: {}
  pull_request: {}
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust nightly with rust-src
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rust-src

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose
