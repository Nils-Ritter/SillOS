name: Build OS

on:
  push: {}
  pull_request: {}
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup deps
        run: rustup component add rust-src --toolchain x86_64-unknown-none

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose
